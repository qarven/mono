[package]
name = "mono"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generated protobuf types and Connect stubs for mono modules"

[lib]
path = "lib.rs"

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = "0.9.0"
serde = { version = "1", features = ["derive"] }
