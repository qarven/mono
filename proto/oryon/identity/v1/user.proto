syntax = "proto3";

package oryon.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// ========
// services
// ========

service UserService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc UpdateCurrentUser(UpdateCurrentUserRequest) returns (UpdateCurrentUserResponse);
  rpc ListEmails(ListEmailsRequest) returns (ListEmailsResponse);
  rpc AddEmail(AddEmailRequest) returns (AddEmailResponse);
  rpc RemoveEmail(RemoveEmailRequest) returns (RemoveEmailResponse);
  rpc SetPrimaryEmail(SetPrimaryEmailRequest) returns (SetPrimaryEmailResponse);
}

// =====
// enums
// =====

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_SUSPENDED = 4;
  USER_STATUS_DELETED = 5;
}

enum IdentityProvider {
  IDENTITY_PROVIDER_UNSPECIFIED = 0;
  IDENTITY_PROVIDER_GOOGLE = 1;
  IDENTITY_PROVIDER_APPLE = 2;
  IDENTITY_PROVIDER_GITHUB = 3;
  IDENTITY_PROVIDER_FACEBOOK = 4;
  IDENTITY_PROVIDER_MICROSOFT = 5;
}

// ======
// models
// ======

// User maps to the `users` table.
message User {
  int64 id = 1;
  UserStatus status = 2;
  string name = 3 [(buf.validate.field).string.min_len = 1];
  // avatar_url is nullable in DB; optional indicates absence.
  optional string avatar_url = 4 [(buf.validate.field).string.uri = true];
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional google.protobuf.Timestamp deleted_at = 7;
}

// UserEmail maps to `user_emails` table.
message UserEmail {
  int64 id = 1;
  int64 user_id = 2;
  string email = 3 [(buf.validate.field).string.email = true];
  bool is_primary = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp verified_at = 6;
  optional google.protobuf.Timestamp deleted_at = 7;
}

// UserPhoneNumber maps to `user_phone_numbers` table.
// Phone stored in E.164 format (+1234567890).
message UserPhoneNumber {
  int64 id = 1;
  int64 user_id = 2;
  string phone = 3 [
    (buf.validate.field).string.pattern = "^\\+[1-9]\\d{1,14}$",
    (buf.validate.field).string.example = "+1234567890"
  ];
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp verified_at = 5;
  optional google.protobuf.Timestamp deleted_at = 6;
}

// Identity maps to `identities` table (federated/OIDC identities).
message Identity {
  int64 id = 1;
  int64 user_id = 2;
  IdentityProvider provider = 3;
  string provider_subject = 4 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp last_used_at = 6;
  optional google.protobuf.Timestamp revoked_at = 7;
}

// UserProfile aggregates basic profile for convenience in responses.
message UserProfile {
  User user = 1;
  repeated UserEmail emails = 2;
  repeated UserPhoneNumber phone_numbers = 3;
  repeated Identity identities = 4;
}

// ==============
// rpc messages
// ==============

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
  repeated UserEmail emails = 2;
  repeated UserPhoneNumber phone_numbers = 3;
  repeated Identity identities = 4;
}

message UpdateCurrentUserRequest {
  // Only fields present in update_mask will be applied.
  // Allowed paths: "name", "avatar_url".
  optional string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string avatar_url = 2 [(buf.validate.field).string.uri = true];
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateCurrentUserResponse {
  User user = 1;
}

message ListEmailsRequest {
  // Pagination for future extensibility; currently emails per user are few.
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  string page_token = 2;
  bool include_deleted = 3;
}

message ListEmailsResponse {
  repeated UserEmail emails = 1;
  string next_page_token = 2;
}

message AddEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  // If true, send verification immediately; otherwise caller must call
  // RequestEmailVerification separately.
  bool send_verification = 2;
}

message AddEmailResponse {
  UserEmail email = 1;
  bool verification_required = 2;
  // Present when verification was initiated; used to poll or complete verification.
  optional string verification_id = 3;
}

message RemoveEmailRequest {
  int64 email_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RemoveEmailResponse {}

message SetPrimaryEmailRequest {
  int64 email_id = 1 [(buf.validate.field).int64.gt = 0];
}

message SetPrimaryEmailResponse {
  UserEmail email = 1;
}
