syntax = "proto3";

package oryon.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ========
// services
// ========

service SessionService {
  rpc GetCurrentSession(GetCurrentSessionRequest) returns (GetCurrentSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAllOtherSessions(RevokeAllOtherSessionsRequest) returns (RevokeAllOtherSessionsResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// =====
// enums
// =====

// ======
// models
// ======

// Session maps to the `sessions` table.
// token is stored as SHA-256 hash (BYTEA) and never returned in plain text via API.
message Session {
  int64 id = 1;
  int64 user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
  optional google.protobuf.Timestamp revoked_at = 6;
  // INET address string; e.g., "192.0.2.1" or "2001:db8::1".
  optional string ip_address = 7 [(buf.validate.field).string.ip = true];
  optional string user_agent = 8;
  optional google.protobuf.Timestamp mfa_verified_at = 9;
  // Convenience flag set by server: true if this is the caller's current session.
  bool is_current = 10;
}

// RefreshToken maps to `refresh_tokens` table.
// token hash is never returned; only metadata is exposed.
message RefreshToken {
  int64 id = 1;
  int64 session_id = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  optional google.protobuf.Timestamp revoked_at = 5;
  optional int64 replaced_by = 6;
  optional string created_ip = 7 [(buf.validate.field).string.ip = true];
}

// ==============
// rpc messages
// ==============

message GetCurrentSessionRequest {}

message GetCurrentSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100
  ];
  string page_token = 2;
  // By default only active (non-revoked, non-expired) sessions are returned.
  bool include_revoked = 3;
  bool include_expired = 4;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message RevokeSessionRequest {
  int64 session_id = 1 [(buf.validate.field).int64.gt = 0];
}

message RevokeSessionResponse {}

message RevokeAllOtherSessionsRequest {}

message RevokeAllOtherSessionsResponse {
  int64 revoked_count = 1;
}

message LogoutRequest {
  // When empty or 0, revokes the current session (derived from auth header).
  // Otherwise revokes the specified session if it belongs to the caller.
  optional int64 session_id = 1;
  // If true, also revoke all refresh tokens bound to the session.
  bool revoke_refresh_tokens = 2;
}

message LogoutResponse {}
