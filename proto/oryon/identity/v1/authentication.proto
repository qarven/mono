syntax = "proto3";

package oryon.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "oryon/identity/v1/enum.proto";

// ========
// services
// ========

service AuthenticationService {
  rpc Registration(RegistrationRequest) returns (RegistrationResponse);
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);

  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CompleteMfa(CompleteMfaRequest) returns (CompleteMfaResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  rpc InitiateVerification(InitiateVerificationRequest) returns (InitiateVerificationResponse);
  rpc ConfirmVerification(ConfirmVerificationRequest) returns (ConfirmVerificationResponse);
}

// ======
// models
// ======

message Token {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
}

message AuthFlow {
  int64 id = 1;
  AuthFlowType flow_type = 2;
  AuthFlowState flow_state = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message VerificationChallenge {
  int64 id = 1;
  string identifier = 2;
  VerificationPurpose purpose = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message User {
  int64 id = 1;
  UserStatus status = 2;
  string name = 3;
  optional string username = 4;
  optional string avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message UserEmail {
  int64 id = 1;
  int64 user_id = 2;
  string email = 3;
  bool is_primary = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp verified_at = 6;
}

// ==============
// rpc messages
// ==============

message RegistrationRequest {
  option (buf.validate.message).cel = {
    id: "registration.identifier_one_of"
    message: "one of email or phone is required"
    expression: "has(this.email) || has(this.phone)"
  };

  optional string email = 1 [(buf.validate.field).string.email = true];
  optional string phone = 2 [(buf.validate.field).string.pattern = "^\\+[1-9]\\d{1,14}$"];
  string password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
  string name = 4 [(buf.validate.field).string.min_len = 3];
}

message RegistrationResponse {
  AuthFlow flow = 1;
}

message CompleteRegistrationRequest {
  option (buf.validate.message).cel = {
    id: "complete_registration.code_one_of"
    message: "one of email_code or phone_code is required"
    expression: "has(this.email_code) || has(this.phone_code)"
  };

  int64 flow_id = 1;
  optional string email_code = 2 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 8
  ];
  optional string phone_code = 3 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 8
  ];
}

message CompleteRegistrationResponse {
  User user = 1;
}

message LoginRequest {
  // Email, phone (+E.164), or username identifier.
  string identifier = 1 [(buf.validate.field).string.min_len = 3];
  string password = 2 [(buf.validate.field).string.min_len = 3];
}

message LoginResponse {
  optional Token token = 1;
  optional User user = 2;
  optional AuthFlow flow = 3;
  bool mfa_required = 4;
  repeated MfaFactorType available_mfa_methods = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  Token token = 1;
}

message CompleteMfaRequest {
  int64 flow_id = 1 [(buf.validate.field).required = true];
  string code = 2 [(buf.validate.field).required = true];
  MfaFactorType factor_type = 3;
}

message CompleteMfaResponse {
  optional Token token = 1;
  optional User user = 2;
}

message InitiateVerificationRequest {
  string identifier = 1 [(buf.validate.field).string.min_len = 3];
  VerificationPurpose purpose = 2;
  optional int64 flow_id = 3; // if present = server invalidates old challenge, extends flow.expires_at
}

message InitiateVerificationResponse {
  VerificationChallenge challenge = 1;
}

message ConfirmVerificationRequest {
  int64 verification_id = 1;
  string code = 2;
}

message ConfirmVerificationResponse {
  UserEmail user_email = 1;
}
