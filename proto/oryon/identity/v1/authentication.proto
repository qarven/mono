syntax = "proto3";

package oryon.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ========
// services
// ========

service AuthenticationService {
  rpc Registration(RegistrationRequest) returns (RegistrationResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// =====
// enums
// =====

enum AuthFlowType {
  AUTH_FLOW_TYPE_UNSPECIFIED = 0;
  AUTH_FLOW_TYPE_REGISTRATION = 1;
  AUTH_FLOW_TYPE_LOGIN = 2;
  AUTH_FLOW_TYPE_RECOVERY = 3;
  AUTH_FLOW_TYPE_STEP_UP_MFA = 4;
}

enum AuthFlowState {
  AUTH_FLOW_STATE_UNSPECIFIED = 0;
  AUTH_FLOW_STATE_PENDING_IDENTIFIER = 1;
  AUTH_FLOW_STATE_PENDING_PASSWORD = 2;
  AUTH_FLOW_STATE_PENDING_MFA = 3;
  AUTH_FLOW_STATE_PENDING_VERIFICATION = 4;
  AUTH_FLOW_STATE_COMPLETED = 5;
  AUTH_FLOW_STATE_FAILED = 6;
}

enum MfaFactorType {
  MFA_FACTOR_TYPE_UNSPECIFIED = 0;
  MFA_FACTOR_TYPE_TOTP = 1;
  MFA_FACTOR_TYPE_SMS = 2;
  MFA_FACTOR_TYPE_EMAIL = 3;
  MFA_FACTOR_TYPE_WEBAUTHN = 4;
  MFA_FACTOR_TYPE_BACKUP_CODE = 5;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_SUSPENDED = 4;
  USER_STATUS_DELETED = 5;
}

// ======
// models
// ======

message Token {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
}

message AuthFlow {
  int64 id = 1;
  AuthFlowType flow_type = 2;
  AuthFlowState flow_state = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message User {
  int64 id = 1;
  UserStatus status = 2;
  string name = 3;
  optional string username = 4;
  optional string avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Session {
  int64 id = 1;
  int64 user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  optional google.protobuf.Timestamp last_seen_at = 5;
  optional google.protobuf.Timestamp revoked_at = 6;
  optional string ip_address = 7;
  optional string user_agent = 8;
  optional google.protobuf.Timestamp mfa_verified_at = 9;
  bool is_current = 10;
}

// ==============
// rpc messages
// ==============

message RegistrationRequest {
  option (buf.validate.message).cel = {
    id: "registration.identifier_one_of"
    message: "one of email or phone is required"
    expression: "has(this.email) || has(this.phone)"
  };

  optional string email = 1 [(buf.validate.field).string.email = true];
  optional string phone = 2 [(buf.validate.field).string.pattern = "^\\+[1-9]\\d{1,14}$"];
  string password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
  string name = 4 [(buf.validate.field).string.min_len = 3];
}

message RegistrationResponse {
  AuthFlow flow = 1;
}

message LoginRequest {
  // Email, phone (+E.164), or username identifier.
  string identifier = 1 [(buf.validate.field).string.min_len = 3];
  string password = 2 [(buf.validate.field).string.min_len = 3];
}

message LoginResponse {
  optional Token token = 1;
  optional User user = 2;
  optional Session session = 3;
  optional AuthFlow flow = 4;
  bool mfa_required = 5;
  repeated MfaFactorType available_mfa_methods = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  Token token = 1;
}
