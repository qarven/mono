syntax = "proto3";

package oryon.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "oryon/identity/v1/enum.proto";

// ========
// services
// ========

service AuthenticationService {
  rpc Registration(RegistrationRequest) returns (RegistrationResponse);
  rpc CompleteRegistration(CompleteRegistrationRequest) returns (CompleteRegistrationResponse);
  rpc ResendRegistrationCode(ResendRegistrationCodeRequest) returns (ResendRegistrationCodeResponse);

  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc CompleteLoginMfa(CompleteLoginMfaRequest) returns (CompleteLoginMfaResponse);

  rpc InitiatePasswordReset(InitiatePasswordResetRequest) returns (InitiatePasswordResetResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
  rpc ResendPasswordResetCode(ResendPasswordResetCodeRequest) returns (ResendPasswordResetCodeResponse);
}

// ======
// models
// ======

message Token {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
}

message AuthFlow {
  int64 id = 1;
  AuthFlowType flow_type = 2;
  AuthFlowState flow_state = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message VerificationChallenge {
  int64 id = 1;
  string identifier = 2;
  VerificationPurpose purpose = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message User {
  int64 id = 1;
  UserStatus status = 2;
  string name = 3;
  optional string username = 4;
  optional string avatar_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ==============
// rpc messages
// ==============

message RegistrationRequest {
  option (buf.validate.message).cel = {
    id: "registration.identifier_one_of"
    message: "one of email or phone is required"
    expression: "has(this.email) || has(this.phone)"
  };

  optional string email = 1 [(buf.validate.field).string.email = true];
  optional string phone = 2 [(buf.validate.field).string.pattern = "^\\+[1-9]\\d{1,14}$"];
  string password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
  string name = 4 [(buf.validate.field).string.min_len = 3];
}

message RegistrationResponse {
  AuthFlow flow = 1;
}

message CompleteRegistrationRequest {
  option (buf.validate.message).cel = {
    id: "complete_registration.code_one_of"
    message: "one of email_code or phone_code is required"
    expression: "has(this.email_code) || has(this.phone_code)"
  };

  int64 flow_id = 1;
  optional string email_code = 2 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 8
  ];
  optional string phone_code = 3 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 8
  ];
}

message CompleteRegistrationResponse {
  User user = 1;
}

message ResendRegistrationCodeRequest {
  int64 flow_id = 1 [(buf.validate.field).required = true];
}

message ResendRegistrationCodeResponse {
  AuthFlow flow = 1;
}

message LoginRequest {
  // Email, phone (+E.164), or username identifier.
  string identifier = 1 [(buf.validate.field).string.min_len = 3];
  string password = 2 [(buf.validate.field).string.min_len = 3];
}

message LoginToken {
  Token token = 1;
  User user = 2;
}

message LoginMfa {
  AuthFlow flow = 1;
  repeated MfaFactorType available_mfa_methods = 2;
}

message LoginResponse {
  oneof result {
    LoginToken login_token = 1;
    LoginMfa login_mfa = 2;
  }
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message RefreshTokenResponse {
  Token token = 1;
}

message CompleteLoginMfaRequest {
  int64 flow_id = 1 [(buf.validate.field).required = true];
  string code = 2 [(buf.validate.field).required = true];
  MfaFactorType factor_type = 3 [(buf.validate.field).required = true];
}

message CompleteLoginMfaResponse {
  Token token = 1;
  User user = 2;
}

message InitiatePasswordResetRequest {
  string identifier = 1 [(buf.validate.field).string.min_len = 3];
}

message InitiatePasswordResetResponse {
  VerificationChallenge challenge = 1;
}

message CompletePasswordResetRequest {
  int64 verification_id = 1 [(buf.validate.field).required = true];
  string code = 2 [(buf.validate.field).required = true];
  string new_password = 3 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 128
  ];
}

message CompletePasswordResetResponse {
  User user = 1;
}

message ResendPasswordResetCodeRequest {
  int64 verification_id = 1 [(buf.validate.field).required = true];
}

message ResendPasswordResetCodeResponse {
  VerificationChallenge challenge = 1;
}
